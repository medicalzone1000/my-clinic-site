<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-card">
      <h1>تسجيل الدخول</h1>
      <p>أدخل بيانات المستودع وتوكن GitHub الذي يملك صلاحية الكتابة عليه.</p>
      <label class="field"><span>اسم المستخدم (Owner)</span><input id="g-owner" type="text" required autocomplete="off"></label>
      <label class="field"><span>اسم المستودع</span><input id="g-repo" type="text" required autocomplete="off"></label>
      <label class="field"><span>GitHub Token</span><input id="g-token" type="password" required autocomplete="off"></label>
      <label class="check"><input id="g-remember" type="checkbox"><span>تذكر التوكن على هذا الجهاز</span></label>
      <button class="btn" type="submit">دخول</button>
      <p id="g-status" class="g-status" role="alert"></p>
    </form>
  </div>
  <div class="app" hidden>
    <aside class="side">
      <div class="brand">لوحة التحكم</div>
      <nav id="menu"></nav>
      <a class="view-site" href="index.html" target="_blank" rel="noopener">فتح الموقع</a>
    </aside>
    <main class="main">
      <header class="bar">
        <button id="toggle" class="icon-btn" aria-label="القائمة">☰</button>
        <h1 id="title"></h1>
        <span id="toast" class="toast" role="status" aria-live="polite"></span>
        <span id="dirty" class="dirty" hidden>تعديلات غير منشورة</span>
        <button id="publish" class="btn" type="button">نشر على GitHub</button>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
